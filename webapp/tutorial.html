<!doctype html>
<html lang="en">
  <head>
    <script>/* Apply the shared preference before the page renders. */
      (function(){var selected;try{selected=localStorage.getItem('build-it-live:color-theme');}catch(e){};
      document.documentElement.dataset.theme = selected==='dark'||(selected!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';})();
    </script>
    <!-- Consistent Inter weights across Windows/macOS; system fonts remain as offline fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build It Live guide: Introduction, Hardware Builder setup and ESP32 connection, Brick Maker printing, and Digital Builder tutorial." />
    <title>Build It Live / Guide</title>
  </head>
  <body class="tutorial-body">
    <div id="root"></div>
    <script type="module" src="/src/tutorial.tsx"></script>
  </body>
</html>
