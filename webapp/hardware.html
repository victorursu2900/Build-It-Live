<html lang="en"><head>
    <script>/* Apply the shared preference before the page renders. */
      (function(){var selected;try{selected=localStorage.getItem('build-it-live:color-theme');}catch(e){};
      document.documentElement.dataset.theme = selected==='dark'||(selected!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';})();
